skill: wtf
model: haiku

tests:
  - id: invoke-wtf
    prompt: "/wtf"
    should_trigger: true

  - id: explain-last-answer
    prompt: "What does that last answer mean?"
    should_trigger: true

  - id: simplify-last-response
    prompt: "Rewrite your previous response in plain English"
    should_trigger: true

  - id: negative-editor
    prompt: "Review this README and list the writing problems"
    should_trigger: false

  - id: negative-new-answer
    prompt: "Explain DNS caching in plain English"
    should_trigger: false
